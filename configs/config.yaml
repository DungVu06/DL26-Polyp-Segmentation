defaults:
  - paths: default
  - dataset: kvasir
  - model: transunet
  - loss: bce_dice
  - optimizer: adamw
  - scheduler: plateau
  - logger: wandb
  - trainer: default
  - evaluation: default
  - _self_

project:
  name: polyp-segmentation
  seed: 42
  run_id: run1
  mode: train
  run_name: ${model.name}_${project.run_id}_${project.mode}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.output_dir}/hydra/${project.run_name}
  sweep:
    dir: ${paths.output_dir}/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
